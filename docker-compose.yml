services:
  ollama:
    image: ollama/ollama # Base image, model is pulled by command
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia # GPU support is optional, remove if not needed or causes issues
              count: 1
              capabilities: [gpu]
    command: sh -c "ollama pull ${OLLAMA_MODEL_TAG:-all-minilm:l6-v2} && ollama serve"

  qdrant:
    image: qdrant/qdrant:latest # Consider parameterizing QDRANT_IMAGE_TAG if needed
    ports:
      - "${QDRANT_HOST_HTTP_PORT:-6333}:6333" # HTTP port
      - "${QDRANT_HOST_GRPC_PORT:-6334}:6334" # gRPC port
    volumes:
      - ./qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334" # Ensure gRPC port is explicitly set if client expects it
      # For production, consider setting API keys:
      # QDRANT_API_KEY: your_api_key_here
      # QDRANT_READ_ONLY_API_KEY: your_read_only_api_key_here
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 10s

volumes:
  ollama_data:
    driver: local
  qdrant_data:
    driver: local
