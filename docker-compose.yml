services:
  ollama:
    image: ollama/ollama # Base image, model is pulled by command
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia # GPU support is optional, remove if not needed or causes issues
              count: 1
              capabilities: [gpu]
    command: sh -c "ollama pull ${OLLAMA_EMBEDDING_MODEL:-all-minilm:l6-v2} && ollama serve"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2 # Use a specific version
    ports:
      - "${ELASTICSEARCH_HOST_PORT:-9200}:9200"
      - "${ELASTICSEARCH_TRANSPORT_PORT:-9300}:9300" # Optional, for internode communication if scaling
    volumes:
      - ./elasticsearch_data:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # For development ease, consider true for production
      # - ELASTIC_PASSWORD=yoursecurepassword # Set if xpack.security.enabled=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m # Adjust memory as needed
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
    #   interval: 10s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 20s

volumes:
  ollama_data:
    driver: local
  elasticsearch_data: # New volume for Elasticsearch data
    driver: local
