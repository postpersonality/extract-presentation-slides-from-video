services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: sh -c "ollama pull all-minilm:l6-v2 && ollama serve"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334" # Ensure gRPC port is explicitly set if client expects it
      # For production, consider setting API keys:
      # QDRANT_API_KEY: your_api_key_here
      # QDRANT_READ_ONLY_API_KEY: your_read_only_api_key_here
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 10s

volumes:
  ollama_data:
    driver: local
  qdrant_data:
    driver: local
